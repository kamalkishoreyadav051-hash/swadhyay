name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Seed database (optional, skip in CI since Railway handles it)
        run: echo "Database is seeded on first run by Railway start command"

      - name: Start server (smoke test)
        run: timeout 5 npm start || true

      - name: Railway Deploy
        uses: bervProject/railway-deploy@v3
        with:
          service: swadhyay
          token: ${{ secrets.RAILWAY_TOKEN }}
