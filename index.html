<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>स्वाध्याय — Online Bookstore</title>
<meta name="description" content="स्वाध्याय — India's vibrant online bookstore. Browse fiction, self-help, history, biography & more.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237b2ff7'/><rect x='20' y='22' width='60' height='60' rx='8' fill='%23ffd166'/><rect x='48' y='26' width='4' height='52' fill='%237b2ff7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--coral:#ff6b6b;--teal:#06d6a0;--mustard:#ffd166;--purple:#7b2ff7;--sky:#4cc9f0;--ink:#1d1b2e;--paper:#fff8f0;--paper-2:#fff1e6;--shadow:0 8px 24px rgba(123,47,247,.18);--radius:18px;--radius-sm:12px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
h1,h2,h3,h4{font-family:'Fredoka','Poppins',sans-serif;font-weight:600;line-height:1.15}
.brand{font-family:'Noto Sans Devanagari','Fredoka','Poppins',sans-serif;font-weight:600}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--purple),var(--coral));color:#fff;box-shadow:var(--shadow)}
.nav{max-width:1200px;margin:0 auto;padding:.8rem 1.2rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.brand{font-size:1.6rem;letter-spacing:.5px;display:flex;align-items:center;gap:.5rem;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:50%;background:var(--mustard);color:var(--ink);display:grid;place-items:center;font-size:1.3rem;font-weight:700}
.nav-links{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:1rem}
.nav-links a{padding:.4rem .9rem;border-radius:999px;font-weight:500;font-size:.95rem;transition:.2s;cursor:pointer}
.nav-links a:hover{background:rgba(255,255,255,.22)}.nav-links a.active{background:#fff;color:var(--purple)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.2);padding:.35rem .8rem;border-radius:999px}
.search input{border:0;background:transparent;color:#fff;outline:0;width:160px;font-size:.9rem}.search input::placeholder{color:rgba(255,255,255,.8)}
.cart-btn{position:relative;display:flex;align-items:center;gap:.4rem;background:var(--mustard);color:var(--ink);padding:.5rem 1rem;border-radius:999px;font-weight:600;cursor:pointer;border:0;font-family:inherit;font-size:.95rem;transition:transform .15s}
.cart-btn:hover{transform:translateY(-2px)}
.cart-count{position:absolute;top:-6px;right:-6px;background:var(--teal);color:#fff;font-size:.75rem;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;border:2px solid var(--purple)}
.hero{max-width:1200px;margin:0 auto;padding:3rem 1.2rem 2rem;display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center}
.hero h1{font-size:3.2rem;color:var(--ink)}.hero h1 span{color:var(--coral)}
.hero p{margin:1rem 0 1.5rem;font-size:1.1rem;color:#5a546b;max-width:30rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:999px;font-weight:600;cursor:pointer;border:0;font-family:inherit;font-size:1rem;transition:transform .15s,box-shadow .15s}
.btn-primary{background:var(--purple);color:#fff;box-shadow:var(--shadow)}.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--paper-2);color:var(--ink)}.btn-ghost:hover{background:var(--mustard)}
.hero-art{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.hero-art .book-cover{aspect-ratio:2/3;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer}
.hero-art .book-cover img{width:100%;height:100%;object-fit:cover}.hero-art .book-cover:nth-child(2){transform:translateY(18px)}
.section{max-width:1200px;margin:0 auto;padding:2.5rem 1.2rem}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap}
.section-head h2{font-size:2rem}.section-head h2 span{color:var(--coral)}
.see-all{color:var(--purple);font-weight:600;cursor:pointer}.see-all:hover{text-decoration:underline}
.pills{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem}
.pill{padding:.45rem 1rem;border-radius:999px;border:2px solid transparent;background:var(--paper-2);font-weight:500;cursor:pointer;font-size:.9rem;font-family:inherit;transition:.15s}
.pill:hover{border-color:var(--purple)}.pill.active{background:var(--purple);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.4rem}
.card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 18px rgba(29,27,46,.08);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.cover-wrap{padding:.9rem .9rem 0}
.book-cover{aspect-ratio:2/3;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--purple),var(--coral))}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:.5rem;color:#fff;font-family:Fredoka,sans-serif}
.book-cover .ct{font-family:Fredoka,sans-serif}
.book-cover .badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:.15rem .55rem;font-size:.7rem;z-index:1}
.card-body{padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.card-body .author{font-size:.8rem;color:#8a82a0}.card-body .stars{color:var(--mustard);font-size:.8rem}
.card-body .price{font-weight:700;color:var(--ink);font-size:1.05rem}
.card-body .price .old{color:#b6afc8;text-decoration:line-through;font-weight:400;font-size:.85rem;margin-left:.3rem}
.add-btn{margin-top:auto;background:var(--teal);color:#00352a;border:0;font-weight:600;padding:.5rem;border-radius:10px;cursor:pointer;font-family:inherit;transition:.15s}
.add-btn:hover{background:var(--mustard)}
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.2rem 4rem}
.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem}
.flex{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.muted{color:#6b657f}.center{text-align:center}
.detail-cover{border-radius:18px;box-shadow:var(--shadow);aspect-ratio:2/3;max-width:340px;margin:0 auto;overflow:hidden;background:linear-gradient(135deg,var(--purple),var(--coral))}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:1rem 0}
.detail-meta div{background:var(--paper-2);border-radius:12px;padding:.7rem .9rem}
.detail-meta b{display:block;font-size:.75rem;color:#8a82a0;font-weight:500}
.qty{display:inline-flex;align-items:center;border:2px solid var(--purple);border-radius:999px;overflow:hidden}
.qty button{background:#fff;border:0;width:38px;height:38px;font-size:1.2rem;cursor:pointer;color:var(--purple)}.qty span{padding:0 .8rem;font-weight:600}
.cart-table{display:flex;flex-direction:column;gap:1rem}
.row{display:grid;grid-template-columns:64px 1fr auto auto auto;gap:1rem;align-items:center;background:#fff;border-radius:14px;padding:.8rem;box-shadow:0 4px 12px rgba(29,27,46,.06)}
.row .mini{width:48px;height:64px;border-radius:8px;overflow:hidden;background:var(--paper-2)}.row .mini img{width:100%;height:100%;object-fit:cover}
.row .del{background:none;border:0;color:var(--coral);cursor:pointer;font-size:1.1rem}
.summary{background:#fff;border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);position:sticky;top:90px}
.summary h3{margin-bottom:1rem}.summary .line{display:flex;justify-content:space-between;margin:.5rem 0;color:#5a546b}
.summary .total{border-top:2px dashed var(--paper-2);margin-top:1rem;padding-top:1rem;font-size:1.4rem;font-weight:700;display:flex;justify-content:space-between}
.field{margin:.7rem 0}.field label{display:block;font-size:.85rem;margin-bottom:.3rem;color:#5a546b;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:.7rem .9rem;border:2px solid var(--paper-2);border-radius:12px;font-family:inherit;font-size:.95rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--purple)}
.empty{text-align:center;padding:4rem 1rem;color:#8a82a0}.empty a,.empty .see-all{color:var(--purple);font-weight:600;cursor:pointer}
.footer{background:var(--ink);color:#cbc6dd;margin-top:2rem}
.footer .inner{max-width:1200px;margin:0 auto;padding:2.5rem 1.2rem;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:2rem}
.footer h4{color:#fff;margin-bottom:.8rem;font-size:1.05rem}.footer a{display:block;padding:.2rem 0;color:#cbc6dd;cursor:pointer}.footer a:hover{color:var(--mustard)}
.footer .brand{color:#fff;margin-bottom:.6rem}.footer .bottom{border-top:1px solid #33313f;text-align:center;padding:1rem;color:#8a82a0;font-size:.85rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:.8rem 1.4rem;border-radius:999px;box-shadow:var(--shadow);z-index:200;transition:transform .3s;font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0)}
.page{display:none}.page.active{display:block}
@media(max-width:860px){.hero{grid-template-columns:1fr;text-align:center}.hero-art{max-width:340px;margin:0 auto}.two-col{grid-template-columns:1fr}.footer .inner{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.hero h1{font-size:2.3rem}.row{grid-template-columns:48px 1fr auto;grid-template-areas:"img info qty" "img del price"}.row .mini{grid-area:img}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FREE_SHIP=599,SHIP_FEE=49;
const BOOKS=[
{id:1,title:"The Midnight Library",author:"Matt Haig",category:"Fiction",price:399,oldPrice:550,rating:4.5,reviews:1240,pages:304,lang:"English",year:2020,isbn:"9781786892720",publisher:"Canongate",stock:12,colors:["#7b2ff7","#f107a3"],featured:true,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9781786892720-L.jpg",desc:"Between life and death there is a library. Each book is a chance to try another life."},
{id:2,title:"Atomic Habits",author:"James Clear",category:"Self-Help",price:449,oldPrice:699,rating:4.8,reviews:5600,pages:320,lang:"English",year:2018,isbn:"9781847941831",publisher:"Random House",stock:25,colors:["#06d6a0","#0a9396"],featured:true,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9781847941831-L.jpg",desc:"Tiny changes, remarkable results. A proven framework for improving every day."},
{id:3,title:"Sapiens",author:"Yuval Noah Harari",category:"History",price:599,oldPrice:799,rating:4.7,reviews:3200,pages:464,lang:"English",year:2014,isbn:"9780062316097",publisher:"Harper",stock:8,colors:["#ffd166","#ee9b00"],featured:true,bestseller:false,cover_url:"https://covers.openlibrary.org/b/isbn/9780062316097-L.jpg",desc:"A bold exploration of how Homo sapiens came to dominate the earth."},
{id:4,title:"The Alchemist",author:"Paulo Coelho",category:"Fiction",price:299,oldPrice:399,rating:4.6,reviews:8900,pages:208,lang:"English",year:1988,isbn:"9780061122415",publisher:"HarperOne",stock:40,colors:["#ff6b6b","#c1121f"],featured:true,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9780061122415-L.jpg",desc:"A shepherd boy travels from Spain to the Egyptian desert in search of treasure."},
{id:5,title:"Wings of Fire",author:"A.P.J. Abdul Kalam",category:"Biography",price:349,oldPrice:499,rating:4.9,reviews:6700,pages:180,lang:"English",year:1999,isbn:"9788173711466",publisher:"Universities Press",stock:18,colors:["#4cc9f0","#3a86ff"],featured:true,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9788173711466-L.jpg",desc:"The inspiring autobiography of India's missile man and former President."},
{id:6,title:"Rich Dad Poor Dad",author:"Robert Kiyosaki",category:"Finance",price:399,oldPrice:550,rating:4.4,reviews:4100,pages:336,lang:"English",year:1997,isbn:"9781612680194",publisher:"Plata Publishing",stock:15,colors:["#06d6a0","#2d6a4f"],featured:false,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9781612680194-L.jpg",desc:"What the rich teach their kids about money that the poor and middle class do not."},
{id:7,title:"Ikigai",author:"Héctor García",category:"Self-Help",price:375,oldPrice:499,rating:4.5,reviews:2800,pages:208,lang:"English",year:2017,isbn:"9780143170776",publisher:"Penguin",stock:22,colors:["#ffd166","#f4a261"],featured:true,bestseller:false,cover_url:"https://covers.openlibrary.org/b/isbn/9780143170776-L.jpg",desc:"The Japanese secret to a long and happy life."},
{id:8,title:"1984",author:"George Orwell",category:"Fiction",price:279,oldPrice:399,rating:4.7,reviews:12000,pages:328,lang:"English",year:1949,isbn:"9780451524935",publisher:"Signet Classic",stock:30,colors:["#1d1b2e","#4a4e69"],featured:false,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9780451524935-L.jpg",desc:"A dystopian masterpiece where Big Brother watches everything."},
{id:9,title:"The Psychology of Money",author:"Morgan Housel",category:"Finance",price:399,oldPrice:550,rating:4.7,reviews:3600,pages:256,lang:"English",year:2020,isbn:"9789390166263",publisher:"Jaico",stock:20,colors:["#ff6b6b","#7b2ff7"],featured:true,bestseller:true,cover_url:"https://covers.openlibrary.org/b/isbn/9789390166263-L.jpg",desc:"Timeless lessons on wealth, greed and happiness."},
{id:10,title:"A Brief History of Time",author:"Stephen Hawking",category:"Science",price:499,oldPrice:650,rating:4.6,reviews:2900,pages:256,lang:"English",year:1988,isbn:"9780553380163",publisher:"Bantam",stock:10,colors:["#4cc9f0","#7209b7"],featured:false,bestseller:false,cover_url:"https://covers.openlibrary.org/b/isbn/9780553380163-L.jpg",desc:"From the Big Bang to black holes — an accessible introduction to cosmology."},
{id:11,title:"Pride and Prejudice",author:"Jane Austen",category:"Fiction",price:249,oldPrice:350,rating:4.8,reviews:7800,pages:432,lang:"English",year:1813,isbn:"9780141439518",publisher:"Penguin Classics",stock:28,colors:["#f107a3","#ffd166"],featured:false,bestseller:false,cover_url:"https://covers.openlibrary.org/b/isbn/9780141439518-L.jpg",desc:"Elizabeth Bennet and Mr Darcy navigate love and class in Regency England."},
{id:12,title:"A Man Called Ove",author:"Fredrik Backman",category:"Fiction",price:379,oldPrice:499,rating:4.7,reviews:5400,pages:337,lang:"English",year:2012,isbn:"9781476738024",publisher:"Atria Books",stock:14,colors:["#ee9b00","#bb3e03"],featured:true,bestseller:false,cover_url:"https://covers.openlibrary.org/b/isbn/9781476738024-L.jpg",desc:"A grumpy old man has his life turned upside down by a chatty young family."}
];
const CATEGORIES=["All","Fiction","Self-Help","History","Biography","Finance","Science"];
function inr(n){return"₹"+Number(n).toLocaleString("en-IN")}
function stars(r){if(!r)return"";const f=Math.floor(r),h=(r%1)>=.5;let s="★".repeat(f);if(h)s+="✬";s+="☆".repeat(5-f-(h?1:0));return s}
function coverHtml(b,cls){if(b.cover_url){return'<div class="'+(cls||'book-cover')+'"><img src="'+b.cover_url+'" alt="'+b.title+'" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.style.background=\'linear-gradient(150deg,'+b.colors[0]+','+b.colors[1]+')\'"></div>'}return'<div class="'+(cls||'book-cover')+'" style="background:linear-gradient(150deg,'+b.colors[0]+','+b.colors[1]+')"></div>'}
const CART_KEY="swadhyay_cart";
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch{return[]}}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c))}
function cartCount(){return getCart().reduce((n,i)=>n+i.qty,0)}
function cartSubtotal(){return getCart().reduce((n,i)=>{const b=BOOKS.find(x=>x.id===i.id);return b?n+b.price*i.qty:n},0)}
function addToCart(id,qty=1){const c=getCart();const it=c.find(i=>i.id===id);if(it)it.qty+=qty;else c.push({id,qty});saveCart(c);updateCartBadge();toast("Added to cart ✓")}
function setQty(id,qty){let c=getCart();const it=c.find(i=>i.id===id);if(!it)return;it.qty=Math.max(1,qty);if(it.qty<=0)c=c.filter(i=>i.id!==id);saveCart(c);updateCartBadge()}
function removeItem(id){saveCart(getCart().filter(i=>i.id!==id));updateCartBadge()}
function updateCartBadge(){document.querySelectorAll(".cart-count").forEach(e=>e.textContent=cartCount())}
let toastTimer;
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200)}
let currentCat="All",currentQuery="",currentSort="featured",selectedBookId=null,view="home",detailQty=1,couponApplied=false;
function navigate(v,cat){view=v;if(cat!==undefined)currentCat=cat;if(v==="catalog")currentQuery="";if(v!=="book")selectedBookId=null;history.pushState({view},"","#"+v);render();window.scrollTo(0,0)}
function doSearch(q){currentQuery=q;currentCat="All";navigate("catalog")}
function openBook(id){selectedBookId=id;view="book";history.pushState({view:"book"},"","#book");render();window.scrollTo(0,0)}
function renderNav(){const catLinks=CATEGORIES.map(c=>'<a onclick="navigate(\'catalog\',\''+c+'\')" class="'+(view==='catalog'&&currentCat===c?'active':'')+'">'+c+'</a>').join("");return'<header class="topbar"><nav class="nav"><div class="brand" onclick="navigate(\'home\')"><span class="logo">स्व</span>स्वाध्याय</div><div class="nav-links"><a onclick="navigate(\'home\')" class="'+(view==='home'?'active':'')+'">Home</a>'+catLinks+'</div><div class="spacer"></div><form class="search" onsubmit="event.preventDefault();doSearch(this.querySelector(\'input\').value)"><input type="text" placeholder="Search books..."></form><button class="cart-btn" onclick="navigate(\'cart\')">🛒 Cart <span class="cart-count">0</span></button></nav></header>'}
function renderFooter(){return'<footer class="footer"><div class="inner"><div><div class="brand"><span class="logo">स्व</span>स्वाध्याय</div><p style="max-width:22rem">Your friendly neighbourhood online bookstore. Vibrant stories, delivered to your door.</p></div><div><h4>Shop</h4><a onclick="navigate(\'catalog\')">All books</a><a onclick="navigate(\'catalog\',\'Fiction\')">Fiction</a><a onclick="navigate(\'catalog\',\'Self-Help\')">Self-Help</a><a onclick="navigate(\'catalog\',\'Finance\')">Finance</a></div><div><h4>Company</h4><a>About us</a><a>Careers</a><a>Blog</a><a>Contact</a></div><div><h4>Help</h4><a>Shipping</a><a>Returns</a><a>FAQ</a><a>Track order</a></div></div><div class="bottom">© 2026 स्वाध्याय. Made with ❤ for readers in India.</div></footer>'}
function card(b){const hasImg=b.cover_url;return'<div class="card"><div class="cover-wrap"><div class="book-cover" onclick="openBook('+b.id+')">'+(b.bestseller?'<span class="badge">★ Bestseller</span>':'')+(hasImg?'<img src="'+b.cover_url+'" alt="'+b.title+'" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.style.background=\'linear-gradient(150deg,'+b.colors[0]+','+b.colors[1]+')\'">':'')+'<div class="overlay"><div class="ct">'+b.title+'</div><div style="font-size:.75rem;opacity:.9">'+b.author+'</div></div></div></div><div class="card-body"><div style="font-weight:600;font-size:.95rem;line-height:1.3;cursor:pointer" onclick="openBook('+b.id+')">'+b.title+'</div><div class="author">'+b.author+'</div><div class="stars">'+stars(b.rating)+' <span class="muted" style="font-size:.75rem">('+b.reviews+')</span></div><div class="price">'+inr(b.price)+' <span class="old">'+inr(b.oldPrice)+'</span></div><button class="add-btn" onclick="addToCart('+b.id+')">Add to cart</button></div></div>'}
function renderHome(){const featured=BOOKS.filter(b=>b.featured).slice(0,5);const bestsellers=BOOKS.filter(b=>b.bestseller).slice(0,5);const heroPicks=BOOKS.filter(b=>b.featured).slice(0,3);const heroArt=heroPicks.map(b=>'<div class="book-cover" onclick="openBook('+b.id+')"><img src="'+b.cover_url+'" alt="'+b.title+'" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.style.background=\'linear-gradient(150deg,'+b.colors[0]+','+b.colors[1]+')\'"></div>').join("");const catPills=CATEGORIES.map(c=>'<button class="pill" onclick="navigate(\'catalog\',\''+c+'\')">'+c+'</button>').join("");return renderNav()+'<section class="hero"><div><h1>Find your next <span>adventure</span> between the pages.</h1><p>From midnight libraries to atomic habits — स्वाध्याय brings you handpicked reads at prices that smile. Free shipping over ₹599.</p><div class="flex"><button class="btn btn-primary" onclick="navigate(\'catalog\')">Browse books →</button></div></div><div class="hero-art">'+heroArt+'</div></section><section class="section" style="padding-top:1rem"><div class="pills">'+catPills+'</div></section><section class="section" id="featured"><div class="section-head"><h2>Featured <span>reads</span></h2><span class="see-all" onclick="navigate(\'catalog\')">View all →</span></div><div class="grid">'+featured.map(card).join("")+'</div></section><section class="section" style="padding-top:0"><div class="section-head"><h2>Reader <span>favourites</span></h2><span class="see-all" onclick="navigate(\'catalog\')">View all →</span></div><div class="grid">'+bestsellers.map(card).join("")+'</div></section><section class="section"><div style="background:linear-gradient(110deg,var(--teal),var(--sky));border-radius:24px;padding:2.5rem;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;box-shadow:var(--shadow)"><div><h2 style="color:#fff;font-size:2rem">Flat 30% off this week</h2><p style="opacity:.95">On all Fiction & Self-Help. Use code <b style="background:rgba(0,0,0,.2);padding:.2rem .6rem;border-radius:8px">READ30</b> at checkout.</p></div><button class="btn" style="background:var(--ink);color:#fff" onclick="navigate(\'catalog\',\'Fiction\')">Shop the sale</button></div></section>'+renderFooter()}
function renderCatalog(){const pills=CATEGORIES.map(c=>'<button class="pill '+(currentCat===c?'active':'')+'" onclick="navigate(\'catalog\',\''+c+'\')">'+c+'</button>').join("");let list=BOOKS.slice();if(currentCat&&currentCat!=="All")list=list.filter(b=>b.category===currentCat);if(currentQuery)list=list.filter(b=>(b.title+" "+b.author+" "+b.category).toLowerCase().includes(currentQuery.toLowerCase()));if(currentSort==="price-asc")list.sort((a,b)=>a.price-b.price);else if(currentSort==="price-desc")list.sort((a,b)=>b.price-a.price);else if(currentSort==="rating")list.sort((a,b)=>b.rating-a.rating);else if(currentSort==="title")list.sort((a,b)=>a.title.localeCompare(b.title));else list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));const title=(currentCat==="All"&&!currentQuery)?"All <span>books</span>":currentQuery?"Results for \"<span>"+currentQuery+"</span>\"":currentCat+" <span>books</span>";return renderNav()+'<section class="wrap"><div class="section-head" style="margin-bottom:1rem"><h2>'+title+'</h2><span class="muted">'+list.length+' book'+(list.length!==1?"s":"")+'</span></div><div class="pills">'+pills+'</div><div class="flex" style="margin-bottom:1.2rem;gap:.8rem"><label class="muted" style="font-size:.85rem">Sort by:</label><select id="sort" onchange="currentSort=this.value;render()" style="padding:.4rem .8rem;border-radius:10px;border:2px solid var(--paper-2);font-family:inherit;background:#fff"><option value="featured">Featured</option><option value="price-asc" '+(currentSort==='price-asc'?'selected':'')+'>Price: Low to High</option><option value="price-desc" '+(currentSort==='price-desc'?'selected':'')+'>Price: High to Low</option><option value="rating" '+(currentSort==='rating'?'selected':'')+'>Top rated</option><option value="title" '+(currentSort==='title'?'selected':'')+'>Title A–Z</option></select></div>'+(list.length?'<div class="grid">'+list.map(card).join("")+'</div>':'<div class="empty"><h3>No books found 🔍</h3><p>Try a different category or search term.</p><span class="see-all" onclick="navigate(\'catalog\',\'All\')">View all books</span></div>')+'</section>'+renderFooter()}
function renderBook(){const b=BOOKS.find(x=>x.id===selectedBookId);if(!b)return renderNav()+'<section class="wrap"><div class="empty"><h3>Book not found 📭</h3><span class="see-all" onclick="navigate(\'catalog\')">Back to catalog</span></div></section>'+renderFooter();detailQty=1;const discount=b.oldPrice?Math.round((1-b.price/b.oldPrice)*100):0;const related=BOOKS.filter(x=>x.category===b.category&&x.id!==b.id).slice(0,4);return renderNav()+'<section class="wrap"><div class="two-col"><div><span class="pill active" style="display:inline-block;margin-bottom:1rem">'+b.category+'</span><div class="detail-cover">'+(b.cover_url?'<img src="'+b.cover_url+'" alt="'+b.title+'" onerror="this.style.display=\'none\';this.parentElement.style.background=\'linear-gradient(150deg,'+b.colors[0]+','+b.colors[1]+')\'">':'')+'</div></div><div><h1 style="font-size:2.4rem">'+b.title+'</h1><p class="muted" style="font-size:1.05rem">by <b style="color:var(--ink)">'+b.author+'</b></p><div class="stars" style="color:var(--mustard);font-size:1.1rem;margin:.5rem 0">'+stars(b.rating)+' <span class="muted" style="font-size:.85rem;color:#8a82a0">'+b.rating+' · '+b.reviews.toLocaleString("en-IN")+' reviews</span></div><div style="margin:1rem 0"><span style="font-size:2rem;font-weight:700">'+inr(b.price)+'</span>'+(b.oldPrice?'<span style="color:#b6afc8;text-decoration:line-through;font-size:1.1rem;margin-left:.5rem">'+inr(b.oldPrice)+'</span><span style="background:var(--teal);color:#00352a;font-weight:600;padding:.2rem .6rem;border-radius:8px;margin-left:.5rem;font-size:.85rem">'+discount+'% OFF</span>':'')+'</div><p style="margin:1rem 0;color:#5a546b">'+b.desc+'</p><div class="detail-meta"><div><b>Publisher</b>'+b.publisher+'</div><div><b>Year</b>'+b.year+'</div><div><b>Pages</b>'+b.pages+'</div><div><b>Language</b>'+b.lang+'</div><div><b>ISBN</b>'+b.isbn+'</div><div><b>Stock</b>'+(b.stock>0?'<span style="color:var(--teal);font-weight:600">In stock ('+b.stock+')</span>':'<span style="color:var(--coral)">Out of stock</span>')+'</div></div><div class="flex" style="margin-top:1.5rem"><div class="qty"><button onclick="detailQty=Math.max(1,detailQty-1);document.getElementById(\'qty\').textContent=detailQty">−</button><span id="qty">1</span><button onclick="detailQty++;document.getElementById(\'qty\').textContent=detailQty">+</button></div><button class="btn btn-primary" onclick="addToCart('+b.id+',detailQty)">Add to cart</button><button class="btn btn-ghost" onclick="addToCart('+b.id+',detailQty);navigate(\'cart\')">Buy now</button></div><p class="muted" style="margin-top:1rem;font-size:.85rem">🚚 Free shipping over ₹599 · Easy 7-day returns</p></div></div></section>'+(related.length?'<section class="section"><div class="section-head"><h2>You may also <span>like</span></h2></div><div class="grid">'+related.map(r=>'<div class="card"><div class="cover-wrap"><div class="book-cover" onclick="openBook('+r.id+')"><img src="'+r.cover_url+'" alt="'+r.title+'" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.style.background=\'linear-gradient(150deg,'+r.colors[0]+','+r.colors[1]+')\'"></div></div><div class="card-body"><div style="font-weight:600;font-size:.95rem">'+r.title+'</div><div class="author">'+r.author+'</div><div class="price">'+inr(r.price)+'</div><button class="add-btn" onclick="addToCart('+r.id+')">Add to cart</button></div></div>').join("")+'</div></section>':'')+renderFooter()}
function changeQty(id,qty){if(qty<=0)removeItem(id);else setQty(id,qty);render()}
function applyCoupon(){const code=document.getElementById("coupon").value.trim().toUpperCase();const msg=document.getElementById("coupon-msg");if(code==="READ30"){couponApplied=true;msg.style.color="var(--teal)";msg.textContent="✓ 30% off applied!"}else{couponApplied=false;msg.style.color="var(--coral)";msg.textContent="Invalid coupon code"}}
function placeOrder(e){e.preventDefault();const name=document.getElementById("name").value;toast("Order placed, "+name.split(" ")[0]+"! 🎉");setTimeout(()=>{localStorage.removeItem(CART_KEY);updateCartBadge();view="confirm";render()},500)}
function renderCart(){const cart=getCart();if(!cart.length)return renderNav()+'<section class="wrap"><div class="section-head"><h2>Your <span>cart</span></h2></div><div class="empty"><h3>Your cart is empty 🛒</h3><p>Looks like you haven\'t added any books yet.</p><span class="see-all" onclick="navigate(\'catalog\')">Start browsing →</span></div></section>'+renderFooter();const subtotal=cartSubtotal();const shipping=subtotal>=FREE_SHIP?0:SHIP_FEE;const total=subtotal+shipping;const rows=cart.map(i=>{const b=BOOKS.find(x=>x.id===i.id);if(!b)return"";return'<div class="row"><div class="mini">'+(b.cover_url?'<img src="'+b.cover_url+'" alt="">':'')+'</div><div><div style="font-weight:600;cursor:pointer" onclick="openBook('+b.id+')">'+b.title+'</div><div class="author">'+b.author+' · '+b.category+'</div><div class="price" style="margin-top:.2rem">'+inr(b.price)+'</div></div><div class="qty" style="border-color:var(--paper-2)"><button onclick="changeQty('+b.id+','+(i.qty-1)+')">−</button><span>'+i.qty+'</span><button onclick="changeQty('+b.id+','+(i.qty+1)+')">+</button></div><div style="font-weight:700">'+inr(b.price*i.qty)+'</div><button class="del" onclick="changeQty('+b.id+',0)" title="Remove">✕</button></div>'}).join("");return renderNav()+'<section class="wrap"><div class="section-head"><h2>Your <span>cart</span></h2></div><div class="two-col"><div><div class="cart-table">'+rows+'</div><span class="see-all" style="display:inline-block;margin-top:1.2rem;cursor:pointer" onclick="navigate(\'catalog\')">← Continue shopping</span></div><div><div class="summary"><h3>Order summary</h3><div class="line"><span>Subtotal</span><span>'+inr(subtotal)+'</span></div><div class="line"><span>Shipping</span><span>'+(shipping===0?'<span style="color:var(--teal);font-weight:600">FREE</span>':inr(shipping))+'</span></div>'+(subtotal<FREE_SHIP?'<div class="muted" style="font-size:.8rem;margin-top:-.3rem">Add '+inr(FREE_SHIP-subtotal)+' more for free shipping</div>':'')+'<div class="total"><span>Total</span><span>'+inr(total)+'</span></div><form onsubmit="placeOrder(event)" style="margin-top:1.5rem"><div class="field"><label>Coupon code</label><div class="flex" style="gap:.5rem"><input id="coupon" placeholder="READ30" value="'+(couponApplied?'READ30':'')+'"><button type="button" class="btn btn-ghost" onclick="applyCoupon()">Apply</button></div><div id="coupon-msg" class="muted" style="font-size:.8rem;margin-top:.3rem">'+(couponApplied?'✓ 30% off applied!':'')+'</div></div><h3 style="margin-top:1.5rem">Shipping details</h3><div class="field"><label>Full name</label><input id="name" placeholder="Aarav Sharma" required></div><div class="field"><label>Phone</label><input id="phone" type="tel" placeholder="+91 98765 43210" required></div><div class="field"><label>Address</label><input id="addr" placeholder="Flat, Street, City" required></div><div class="flex"><div class="field" style="flex:1"><label>City</label><input id="city" placeholder="Mumbai" required></div><div class="field" style="flex:1"><label>Pincode</label><input id="pin" placeholder="400001" required></div></div><div class="field"><label>Payment method</label><select id="pay"><option>COD (Cash on Delivery)</option><option>UPI</option><option>Credit / Debit Card</option></select></div><button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem;justify-content:center">Place order →</button></form></div></div></div></section>'+renderFooter()}
function renderConfirm(){return renderNav()+'<section class="wrap"><div class="empty"><h2 style="color:var(--teal)">Order confirmed! 🎉</h2><p>Thank you for your order. A confirmation has been sent to your phone.</p><span class="see-all" onclick="navigate(\'catalog\')">Continue shopping →</span></div></section>'+renderFooter()}
function render(){const app=document.getElementById("app");switch(view){case"home":app.innerHTML=renderHome();break;case"catalog":app.innerHTML=renderCatalog();break;case"book":app.innerHTML=renderBook();break;case"cart":app.innerHTML=renderCart();break;case"confirm":app.innerHTML=renderConfirm();break;default:app.innerHTML=renderHome()}updateCartBadge()}
window.addEventListener("popstate",function(){view=location.hash.replace("#","")||"home";render()});
render();updateCartBadge();
</script>
</body>
</html>
