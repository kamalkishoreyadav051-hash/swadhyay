<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>स्वाध्याय — Premium Bookstore | Curated Reads for Discerning Minds</title>
<meta name="description" content="स्वाध्याय — India's premium online bookstore. Discover curated fiction, self-help, philosophy, and more. Free shipping over ₹599.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23d4a574'/><stop offset='1' stop-color='%238b6914'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%23161427'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='url(%23g)' font-family='serif' font-weight='bold'>स्व</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="announce"><span class="pulse-dot"></span>🔥 MEGA BOOK SALE — Flat 30% OFF + Free Shipping over ₹599. Use code READ30 at checkout!</div>
<nav class="navbar">
  <div class="nav-inner">
    <div class="logo" onclick="navigate('home')"><div class="logo-mark">स्व</div><span class="logo-text">स्वाध्याय</span></div>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-right">
      <form class="search-box" onsubmit="event.preventDefault();doSearch(this.querySelector('input').value)"><span style="color:var(--text-4);font-size:14px">🔍</span><input type="text" placeholder="Search books..."></form>
      <button class="cart-btn" onclick="navigate('cart')">🛒 Cart <span class="cart-count">0</span></button>
      <span class="menu-toggle" onclick="toggleMenu()">☰</span>
    </div>
  </div>
</nav>
<div id="app"></div>
<div class="exit-overlay" id="exit-overlay">
  <div class="exit-popup">
    <span class="close" onclick="closeExitPopup()">✕</span>
    <div class="gift">🎁</div>
    <h2>Wait! Get <span class="accent">30% OFF</span></h2>
    <p>Before you go — here's an exclusive discount just for you. Use this code at checkout:</p>
    <div class="code-box"><div class="code">READ30</div><div class="label">Copy this code and apply at checkout</div></div>
    <button class="btn btn-primary" onclick="closeExitPopup();navigate('catalog')">Shop Now →</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
